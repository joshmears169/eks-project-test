apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cluster-autoscaler
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  project: default
  sources:
    - repoURL: https://kubernetes.github.io/autoscaler
      chart: cluster-autoscaler
      targetRevision: 9.37.0
      helm:
        valueFiles:
          - $values/kubernetes/argocd/values/cluster-autoscaler-values.yaml
    - repoURL: https://github.com/joshmears169/eks-project-test.git
      targetRevision: section-1a-tf-and-k8s-argocd
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: kube-system
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
