apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: baseline
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  project: default
  source:
    repoURL: REPO_URL
    targetRevision: part-a-eks-tf
    path: kubernetes/baseline
  destination:
    server: https://kubernetes.default.svc
    namespace: default
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
